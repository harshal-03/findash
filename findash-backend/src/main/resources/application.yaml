spring:
  application:
    name: findash-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/findash
    username: postgres
    password: local123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins:
          - http://localhost:5173
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
